services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zeerocodes
      POSTGRES_USER: zeerocodes
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - revenue_engine_pg:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://zeerocodes:change-me@postgres:5432/zeerocodes
      SESSION_SECRET: change-me-in-production
    ports:
      - "3000:3000"

volumes:
  revenue_engine_pg:
